
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মাতারবাড়ী সঞ্চয় ও ঐক্য সংঘ</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f7f5;color:#17352b}
header{background:#145c43;color:white;padding:24px 16px;text-align:center}
main{max-width:850px;margin:22px auto;padding:0 14px}
.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,button,select{font:inherit;padding:11px;border:1px solid #ccd8d1;border-radius:8px;width:100%;margin:6px 0}
button{background:#145c43;color:white;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
small{color:#5b6e65}
.hidden{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #e3eae6;text-align:left}
.status{display:block;min-height:1.5em;margin-top:5px}
.error{color:#a12727}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
<h2>মাতারবাড়ী সঞ্চয় ও ঐক্য সংঘ</h2>
<p>সঞ্চয় • ঐক্য • উন্নয়ন</p>
</header>

<main>

<section class="card" id="login">
<h3>লগইন</h3>
<p>অ্যাডমিন ইমেইল অথবা সদস্যের User ID দিন।</p>

<label>ইমেইল / User ID</label>
<input id="loginId" placeholder="ইমেইল অথবা MSH001" autocomplete="username">

<label>পাসওয়ার্ড</label>
<input id="password" type="password" autocomplete="current-password">

<button id="loginBtn">লগইন</button>
<small id="loginMsg" class="status"></small>
</section>

<section class="card hidden" id="dashboard">
<div class="row">
<div>
<h3 id="welcome">ড্যাশবোর্ড</h3>
<small>আপনার হিসাব</small>
</div>
<div>
<button id="logoutBtn">লগআউট</button>
</div>
</div>

<h3>মাসিক সঞ্চয়: ৳২০০</h3>
<div id="records">হিসাব লোড হচ্ছে...</div>
</section>

<section class="card hidden" id="admin">

<h3>অ্যাডমিন: নতুন সদস্য যুক্ত করুন</h3>

<label>সদস্যের নাম</label>
<input id="newMemberName" type="text" placeholder="সম্পূর্ণ নাম">

<label>মোবাইল নম্বর</label>
<input id="newMemberPhone" type="tel" placeholder="মোবাইল নম্বর">

<label>ইমেইল ঠিকানা</label>
<input id="newMemberEmail" type="email" placeholder="ইমেইল">

<label>পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label>
<input id="newMemberPassword" type="password" minlength="8" placeholder="পাসওয়ার্ড">

<button id="createAccountBtn">নতুন সদস্য যুক্ত করুন</button>
<small id="createMsg" class="status"></small>
<hr>

<h3>অ্যাডমিন: সদস্যের পাসওয়ার্ড পরিবর্তন</h3>

<label>সদস্য নির্বাচন করুন</label>
<select id="resetMemberId">
<option value="">সদস্য নির্বাচন করুন</option>
</select>

<label>নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label>
<input id="resetPassword" type="password" minlength="8" autocomplete="new-password">

<button id="resetPasswordBtn">পাসওয়ার্ড পরিবর্তন করুন</button>
<small id="resetMsg" class="status"></small>

<hr>

<h3>অ্যাডমিন: লেনদেন যোগ করুন</h3>

<label>সদস্য নির্বাচন করুন</label>
<select id="memberId">
<option value="">সদস্য নির্বাচন করুন</option>
</select>

<div class="row">
<div>
<label>টাকার পরিমাণ</label>
<input id="amount" type="number" min="0.01" step="0.01">
</div>

<div>
<label>লেনদেনের ধরন</label>
<select id="kind">
<option value="">নির্বাচন করুন</option>
<option value="জমা">জমা</option>
<option value="উত্তোলন">উত্তোলন</option>
</select>
</div>
</div>

<label>বিবরণ</label>
<input id="note" maxlength="500" placeholder="বিবরণ">

<button id="transactionBtn">হিসাব সংরক্ষণ</button>
<small id="adminMsg" class="status"></small>

</section>

</main>

<script>
'use strict';

/* Supabase connection */
const projectUrl = 'https://bepgazqwgnulfwiljwsq.supabase.co';

/* এখানে নিজের Publishable Key বসাবে */
const publishableKey = 'sb_publishable_SPWLNOpT0VuH6ktRumSuZg_ZJnlYn10';

let supabaseClient = null;
let currentUser = null;
let isAdmin = false;

const $ = id => document.getElementById(id);

function message(id,text,error=false){
  const el=$(id);
  el.textContent=text;
  el.classList.toggle('error',error);
}

function busy(id,value){
  $(id).disabled=value;
}

function validMemberId(value){
  return /^MSH(?!000)\d{3,}$/.test(value);
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function formatDate(value){
  const d=new Date(value);
  return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('bn-BD');
}

/* Initialize connection automatically */
function initialize(){
  if(!window.supabase?.createClient){
    message('loginMsg','Supabase client লোড হয়নি। পৃষ্ঠা Refresh করুন।',true);
    $('loginBtn').disabled=true;
    return;
  }

  if(!publishableKey || publishableKey === 'YOUR_PUBLISHABLE_KEY_HERE'){
    message('loginMsg','Publishable Key কোডে বসানো হয়নি।',true);
    $('loginBtn').disabled=true;
    return;
  }

  try{
    supabaseClient=window.supabase.createClient(
      projectUrl,
      publishableKey
    );
  }catch(error){
    message('loginMsg','ওয়েবসাইট সংযোগ করা যায়নি।',true);
    $('loginBtn').disabled=true;
  }
}

async function signIn(){
  const loginId=$('loginId').value.trim();
  const password=$('password').value;

  if(!supabaseClient){
    message('loginMsg','ওয়েবসাইট সংযোগ করা যায়নি।',true);
    return;
  }

  if(!loginId || !password){
    message('loginMsg','ইমেইল/User ID ও পাসওয়ার্ড দিন।',true);
    return;
  }

  let email;

  if(validMemberId(loginId.toUpperCase())){
    email=`${loginId.toLowerCase()}@members.matarbari.local`;
  }else if(loginId.includes('@')){
    email=loginId;
  }else{
    message('loginMsg','সঠিক ইমেইল অথবা MSH User ID দিন।',true);
    return;
  }

  busy('loginBtn',true);
  message('loginMsg','লগইন হচ্ছে...');

  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    currentUser=data.user;
    await loadDashboard();

  }catch(error){
    message('loginMsg',error.message || 'লগইন করা যায়নি।',true);
  }finally{
    busy('loginBtn',false);
  }
}

async function loadDashboard(){
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('admin').classList.add('hidden');
  $('records').textContent='হিসাব লোড হচ্ছে...';

  const {data:profile,error}=await supabaseClient
    .from('profiles')
    .select('full_name,role')
    .eq('id',currentUser.id)
    .maybeSingle();

  if(error || !profile){
    await supabaseClient.auth.signOut();
    currentUser=null;
    $('dashboard').classList.add('hidden');
    $('login').classList.remove('hidden');
    message('loginMsg','প্রোফাইল পাওয়া যায়নি।',true);
    return;
  }

  isAdmin=profile.role==='admin';

  $('welcome').textContent=
    `${profile.full_name || 'সদস্য'} — ড্যাশবোর্ড`;

  if(isAdmin){
    $('admin').classList.remove('hidden');
    await loadAdminMembers();
  }

  await loadTransactions();
}

async function loadTransactions(){
  let query=supabaseClient
    .from('transactions')
    .select('id,member_id,amount,transaction_type,description,created_at')
    .order('created_at',{ascending:false});

  if(!isAdmin){
    query=query.eq('member_id',currentUser.id);
  }

  const {data,error}=await query;

  if(error){
    $('records').textContent='হিসাব আনা যায়নি। ডাটাবেস অনুমতি যাচাই করুন।';
    return;
  }

  const transactions=data || [];

  if(!isAdmin){
    const deposits=transactions.filter(
      x=>x.transaction_type==='জমা'
    );

    const totalDeposit=deposits.reduce(
      (sum,x)=>sum+Number(x.amount || 0),0
    );

    const monthly={};

    for(const item of deposits){
      const date=new Date(item.created_at);
      const key=`${date.getFullYear()}-${date.getMonth()}`;

      if(!monthly[key]){
        monthly[key]={
          label:date.toLocaleDateString('bn-BD',{
            month:'long',
            year:'numeric'
          }),
          amount:0
        };
      }

      monthly[key].amount+=Number(item.amount || 0);
    }

    const currentDate=new Date();
    const currentKey=`${currentDate.getFullYear()}-${currentDate.getMonth()}`;
    const currentMonth=monthly[currentKey]?.amount || 0;

    const monthlyRows=Object.values(monthly).map(x=>`
      <tr>
        <td>${escapeHTML(x.label)}</td>
        <td>৳${escapeHTML(x.amount.toLocaleString('bn-BD'))}</td>
      </tr>
    `).join('');

    $('records').innerHTML=`
      <h3>আমার সঞ্চয়ের হিসাব</h3>
      <p><strong>মোট জমা:</strong> ৳${totalDeposit.toLocaleString('bn-BD')}</p>
      <p><strong>চলতি মাসের জমা:</strong> ৳${currentMonth.toLocaleString('bn-BD')}</p>

      <h4>মাসভিত্তিক জমা</h4>
      ${monthlyRows ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>মাস</th><th>জমা</th></tr></thead>
            <tbody>${monthlyRows}</tbody>
          </table>
        </div>
      ` : '<p>এখনো কোনো জমা নেই।</p>'}
      <h4>লেনদেনের বিবরণ</h4>
      ${renderTransactionTable(transactions)}
    `;
  }else{
    $('records').innerHTML=`
      <h3>সকল সদস্যের লেনদেন</h3>
      ${renderTransactionTable(transactions)}
    `;
  }
}

function renderTransactionTable(data){
  if(!data.length){
    return '<p>এখনো কোনো লেনদেন যোগ হয়নি।</p>';
  }

  const rows=data.map(x=>`
    <tr>
      <td>${escapeHTML(formatDate(x.created_at))}</td>
      <td>${escapeHTML(x.transaction_type)}</td>
      <td>৳${escapeHTML(x.amount)}</td>
      <td>${escapeHTML(x.description)}</td>
    </tr>
  `).join('');

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>তারিখ</th><th>ধরন</th><th>টাকা</th><th>বিবরণ</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function loadAdminMembers(){
  const {data,error}=await supabaseClient
    .from('member_directory')
    .select('member_code,full_name,auth_user_id')
    .order('member_code');

  if(error){
    message('createMsg','সদস্য তালিকা আনা যায়নি। অনুমতি যাচাই করুন।',true);
    return;
  }

  const transactionSelect=$('memberId');
  const resetSelect=$('resetMemberId');

  transactionSelect.innerHTML='<option value="">সদস্য নির্বাচন করুন</option>';
  resetSelect.innerHTML='<option value="">সদস্য নির্বাচন করুন</option>';

  for(const member of data || []){
    if(member.auth_user_id){
      const option=document.createElement('option');
      option.value=member.auth_user_id;
      option.textContent=`${member.member_code} — ${member.full_name}`;
      transactionSelect.appendChild(option);

      const resetOption=document.createElement('option');
      resetOption.value=member.member_code;
      resetOption.textContent=`${member.member_code} — ${member.full_name}`;
      resetSelect.appendChild(resetOption);
    }
  }
}

async function createMemberAccount(){
  if(!isAdmin){
    message('createMsg','অনুমতি নেই।',true);
    return;
  }

  const fullName=$('newMemberName').value.trim();
  const phone=$('newMemberPhone').value.trim();
  const email=$('newMemberEmail').value.trim();
  const password=$('newMemberPassword').value;

  if(!fullName || !phone || !email || password.length<8){
    message('createMsg','সব তথ্য পূরণ করুন। পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।',true);
    return;
  }

  busy('createAccountBtn',true);
  message('createMsg','নতুন সদস্য যুক্ত হচ্ছে...');

  try{
    const {data:{session}}=await supabaseClient.auth.getSession();

    if(!session?.access_token){
      throw new Error('অ্যাডমিন সেশন পাওয়া যায়নি। আবার লগইন করুন।');
    }

    const response=await fetch(
      `${projectUrl}/functions/v1/create-member-account`,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey':publishableKey,
          'Authorization':`Bearer ${session.access_token}`
        },
        body:JSON.stringify({
          full_name:fullName,
          phone,
          email,
          password
        })
      }
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(result.error || 'সদস্য যুক্ত করা যায়নি।');
    }

    $('newMemberName').value='';
    $('newMemberPhone').value='';
    $('newMemberEmail').value='';
    $('newMemberPassword').value='';

    message('createMsg',`${result.member_code} — ${result.full_name} সফলভাবে যুক্ত হয়েছে।`);

    await loadAdminMembers();

  }catch(error){
    message('createMsg',error.message || 'সদস্য যুক্ত করা যায়নি।',true);
  }finally{
    busy('createAccountBtn',false);
  }
}
  
async function resetMemberPassword(){
  if(!isAdmin){
    message('resetMsg','অনুমতি নেই।',true);
    return;
  }

  const memberCode=$('resetMemberId').value;
  const password=$('resetPassword').value;

  if(!memberCode || password.length<8){
    message('resetMsg','সদস্য নির্বাচন করুন এবং কমপক্ষে ৮ অক্ষরের নতুন পাসওয়ার্ড দিন।',true);
    return;
  }

  busy('resetPasswordBtn',true);
  message('resetMsg','পাসওয়ার্ড পরিবর্তন হচ্ছে...');

  try{
    const {data:{session}}=await supabaseClient.auth.getSession();

    if(!session?.access_token){
      throw new Error('অ্যাডমিন সেশন পাওয়া যায়নি। আবার লগইন করুন।');
    }

    const response=await fetch(
      `${projectUrl}/functions/v1/admin-reset-member-password`,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey':publishableKey,
          'Authorization':`Bearer ${session.access_token}`
        },
        body:JSON.stringify({
          member_code:memberCode,
          password
        })
      }
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(result.error || 'পাসওয়ার্ড পরিবর্তন করা যায়নি।');
    }

    $('resetPassword').value='';
    message('resetMsg',`${memberCode} সদস্যের পাসওয়ার্ড পরিবর্তন হয়েছে।`);

  }catch(error){
    message('resetMsg',error.message || 'পাসওয়ার্ড পরিবর্তন করা যায়নি।',true);
  }finally{
    busy('resetPasswordBtn',false);
  }
}

async function addTransaction(){
  if(!isAdmin){
    message('adminMsg','অনুমতি নেই।',true);
    return;
  }

  const memberAuthId=$('memberId').value;
  const amount=Number($('amount').value);
  const kind=$('kind').value;
  const note=$('note').value.trim();

  if(!memberAuthId || !Number.isFinite(amount) || amount<=0 ||
     !['জমা','উত্তোলন'].includes(kind)){
    message('adminMsg','সদস্য, টাকার পরিমাণ ও ধরন সঠিকভাবে দিন।',true);
    return;
  }

  busy('transactionBtn',true);
  message('adminMsg','লেনদেন সংরক্ষণ হচ্ছে...');

  try{
    const {error}=await supabaseClient
      .from('transactions')
      .insert({
        member_id:memberAuthId,
        amount,
        transaction_type:kind,
        description:note,
        created_by:currentUser.id
      });

    if(error) throw error;

    $('amount').value='';
    $('kind').value='';
    $('note').value='';

    message('adminMsg','লেনদেন যোগ হয়েছে।');
    await loadTransactions();

  }catch(error){
    message('adminMsg',error.message || 'লেনদেন সংরক্ষণ হয়নি।',true);
  }finally{
    busy('transactionBtn',false);
  }
}

async function signOut(){
  await supabaseClient.auth.signOut();

  currentUser=null;
  isAdmin=false;

  $('dashboard').classList.add('hidden');
  $('admin').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('password').value='';
  $('loginId').value='';

  message('loginMsg','');
}

/* Button actions */
$('loginBtn').addEventListener('click',signIn);
$('logoutBtn').addEventListener('click',signOut);
$('createAccountBtn').addEventListener('click',createMemberAccount);
$('resetPasswordBtn').addEventListener('click',resetMemberPassword);
$('transactionBtn').addEventListener('click',addTransaction);

/* Start automatically */
initialize();

</script>
</body>
</html>
